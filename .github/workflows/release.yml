name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

# Least privilege: only the `release` job needs `contents: write`.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fails fast, before spending ~1h building 8 artifacts: the tag version
  # must match the version of the main `cosh` app package (the binaries
  # embed their own version via CARGO_PKG_VERSION, and the release assets
  # are named cosh-v<VERSION>-...). Bumping the version of the library
  # crates under crates/ is OPTIONAL: the publish job skips any crate
  # already uploaded to crates.io, so releasing unchanged crates is fine.
  verify:
    name: Verify versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches the cosh app version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          crate_version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$crate_version" != "$TAG_VERSION" ]; then
            echo "Version mismatch: Cargo.toml (cosh app) has $crate_version but tag is $TAG_VERSION"
            exit 1
          fi

  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }} (${{ matrix.variant }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        # Two variants per platform, matching what download.sh/download.ps1 expect.
        # Both ship WITHOUT the Home screen (`--no-default-features` drops the
        # default `home` feature, so the app boots straight into a session):
        #   slim       -> cosh-v<VERSION>-<OS>-<ARCH>-slim.tar.gz|.zip
        #                 (no RAG, no Home)
        #   slim-embed -> cosh-v<VERSION>-<OS>-<ARCH>-slim-embed.tar.gz|.zip
        #                 (workspace `embed` feature = local RAG, no Home)
        # `os` must be a real matrix key (not include-only): include entries
        # whose keys don't overlap the matrix get merged into EVERY existing
        # combination instead of creating new ones, so the last entry (win32)
        # used to overwrite the others and only Windows builds were produced.
        # ort-sys (the `embed` feature's ONNX Runtime) is unreliable to ship
        # on macOS: x86_64-apple-darwin has NO prebuilt binaries at all, and
        # the only aarch64-apple-darwin distribution is built with CoreML,
        # whose static-link stage (CoreML framework +
        # onnxruntime_providers_coreml) fails on the runner — macOS therefore
        # ships the slim variant only (the excludes below), while linux and
        # windows keep both variants.
        os: [ubuntu-latest, macos-15-intel, macos-latest, windows-latest]
        variant: [slim, slim-embed]

        exclude:
          - os: macos-15-intel
            variant: slim-embed
          - os: macos-latest
            variant: slim-embed

        # Each include entry references the `os` matrix key, so it merges
        # into the matching combinations (both variants of that platform).
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
          # macos-15-intel is the x64 runner; macos-latest is arm64-only nowadays.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin
            arch: x64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin
            arch: arm64
          # Windows only ships x64 (matching download.ps1).
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32
            arch: x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          # libxkbcommon-dev: linked by the xkbcommon crate (cosh-tools ->
          # xa11y -> xa11y-linux), which declares the symbols via plain
          # `extern "C"` — no pkg-config discovery — so the dev package
          # (headers not needed, just the .so for the linker) must be
          # present or the release link fails with
          # `unable to find library -lxkbcommon`.
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libxkbcommon-dev \
            protobuf-compiler

      # `protoc` is required by the `lance-encoding` build script (via
      # prost-build) when the `embed` variant pulls in lancedb. Windows
      # runners do not ship protoc, so install it on every platform.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package variables
        id: vars
        shell: bash
        run: |
          # Both variants drop the default `home` feature
          # (--no-default-features); slim-embed additionally enables the
          # workspace `embed` feature (local RAG via fastembed).
          if [ "${{ matrix.variant }}" = "slim-embed" ]; then
            echo "variant_suffix=-slim-embed" >> $GITHUB_OUTPUT
            echo "features=--no-default-features --features embed" >> $GITHUB_OUTPUT
          else
            echo "variant_suffix=-slim" >> $GITHUB_OUTPUT
            echo "features=--no-default-features" >> $GITHUB_OUTPUT
          fi

      # The `slim-embed` variant enables the workspace `embed` feature
      # (cosh-tools/embed + fastembed). fastembed pulls the ONNX Runtime
      # shared library as a build-time download, so this job is slower.
      # Both variants are built `--no-default-features` (no Home screen).
      # Both `cosh` and `cosh-uninstall` are shipped; `highlight-demo` is a
      # dev-only target.
      #
      # COSH_TELEMETRY_PUBLISHABLE_KEY is a BUILD-TIME constant: option_env!()
      # bakes the publishable key (safe-to-ship — it only reaches what the
      # public grants allow) into the binaries. Release builds embed it so the
      # installed CLI can upload telemetry without any user-side env setup;
      # local/dev builds leave it unset and the sink stays idle (fail closed).
      - name: Build cosh (${{ matrix.variant }})
        shell: bash
        env:
          COSH_TELEMETRY_PUBLISHABLE_KEY: ${{ secrets.COSH_TELEMETRY_PUBLISHABLE_KEY }}
        run: cargo build --release --locked --bin cosh --bin cosh-uninstall --target ${{ matrix.target }} ${{ steps.vars.outputs.features }}

      - name: Package GitHub Release asset
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          EXT="${{ matrix.platform == 'win32' && '.exe' || '' }}"
          SUFFIX="${{ steps.vars.outputs.variant_suffix }}"
          ASSET="cosh-v${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}${SUFFIX}"

          cd "target/${{ matrix.target }}/release"

          if [ "${{ matrix.platform }}" = "win32" ]; then
            ASSET_FILE="${ASSET}.zip"
            powershell -NoProfile -Command "Compress-Archive -Path 'cosh${EXT}','cosh-uninstall${EXT}' -DestinationPath '${ASSET_FILE}' -Force"
          else
            ASSET_FILE="${ASSET}.tar.gz"
            tar czf "${ASSET_FILE}" "cosh${EXT}" "cosh-uninstall${EXT}"
          fi

          if [ "${{ matrix.platform }}" = "win32" ]; then
            powershell -NoProfile -Command "(Get-FileHash '${ASSET_FILE}' -Algorithm SHA256).Hash.ToLower()" > "${ASSET_FILE}.sha256"
          else
            sha256sum "${ASSET_FILE}" | cut -d' ' -f1 > "${ASSET_FILE}.sha256"
          fi

          mv "${ASSET_FILE}" "${ASSET_FILE}.sha256" "${GITHUB_WORKSPACE}/"

      - name: Upload GitHub Release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}-${{ matrix.arch }}${{ steps.vars.outputs.variant_suffix }}
          path: |
            cosh-*.tar.gz
            cosh-*.zip
            cosh-*.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-assets-*
          merge-multiple: true

      - name: Delete existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${GITHUB_REF_NAME}" -y 2>/dev/null || true

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --notes "See the [changelog](https://github.com/DiegoZaluski/co-sh/blob/main/CHANGELOG.md) for details." \
            --verify-tag

      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) -exec gh release upload "${GITHUB_REF_NAME}" {} \;

  publish-cratesio:
    name: Publish crates to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Bumping library crate versions is OPTIONAL. Each crate is checked
      # against the crates.io sparse index first: a version that is already
      # published is skipped outright (cargo publish would fail with
      # "already exists"), so a release only publishes the crates whose
      # versions were actually bumped for this tag.

      # cargo publish fails when a crate declares `readme = "README.md"` and
      # the file doesn't exist. Replace the placeholders with real READMEs;
      # this step becomes a no-op once they are committed.
      - name: Ensure declared READMEs exist
        shell: bash
        run: |
          for readme in \
            crates/cosh-recall/README.md \
            crates/cosh-sdk/README.md \
            crates/cosh-tools/README.md \
            crates/cosh-tui/README.md
          do
            if [ ! -f "$readme" ]; then
              echo "Creating placeholder $readme"
              printf '# cosh\n\nA coding agent for the terminal.\n' > "$readme"
            fi
          done

      # Publish in dependency order: sdk -> recall -> tools -> tui.
      # Only the library crates are published; the root `cosh` app package
      # is distributed via the GitHub Release binaries instead.
      - name: Publish crates
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          crates="
            cosh-sdk
            cosh-recall
            cosh-tools
            cosh-tui
          "
          for crate in $crates; do
            crate_version="$(grep -m1 '^version = ' "crates/$crate/Cargo.toml" | cut -d'"' -f2)"
            # Skip crates whose current version is already on crates.io:
            # a release with unbumped crates is legitimate, so their
            # absence from the registry is not an error. crates.io requires
            # a User-Agent and blocks bot-ish requests without one (403);
            # anything other than a 200 ("published") or 404 ("definitely
            # not published") — rate limits, network blips — is treated as
            # "unknown" and falls through to cargo publish, where the
            # "already exists" fallback below still resolves it safely.
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: cosh-release (github.com/DiegoZaluski/co-sh)' \
              "https://crates.io/api/v1/crates/$crate/$crate_version" || true)"
            if [ "$code" = "200" ]; then
              echo "$crate $crate_version already published, skipping"
              continue
            elif [ "$code" != "404" ]; then
              echo "crates.io check for $crate $crate_version returned HTTP $code, attempting publish anyway..."
            fi

            echo "Publishing $crate $crate_version..."
            # 101 is cargo's GENERIC error code, not specifically
            # "already published" — only treat it as a skip when the log
            # confirms the crate already exists on the registry (a race
            # between the index check above and this publish, or a
            # republish of an existing version by hand).
            set +e
            cargo publish -p "$crate" 2>&1 | tee "/tmp/publish-$crate.log"
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -eq 101 ] && grep -q "already exists\|is already uploaded" "/tmp/publish-$crate.log"; then
              echo "$crate already published, skipping"
            elif [ "$rc" -ne 0 ]; then
              echo "Failed to publish $crate (exit code $rc)"
              exit "$rc"
            fi
            echo ""
          done
