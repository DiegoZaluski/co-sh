[package]
name = "cosh-harness"
version = "0.1.0"
edition = "2024"

[dependencies.cosh-sdk]
path = "../cosh-sdk"

[dependencies]
serde_json = "1.0"
toml = "1.1"
chrono = "0.4"

[dependencies.rmcp]
version= "1.7.0"
features = [
    "client",
    "server",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
]
default-features = false

[dependencies.tokio]
version = "1.52.3"
features = ["full"]

[dependencies.tokio-stream]
version = "0.1"

[dependencies.xxhash-rust]
version = "0.8"
features = ["xxh32"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dev-dependencies]
tempfile = "3"
