[package]
categories = ["command-line-utilities"]
description = "SDK crate for cosh - coding agent for the terminal"
edition = "2024"
keywords = ["terminal", "cli"]
license = "Apache-2.0"
name = "cosh-sdk"
readme = "README.md"
repository = "https://github.com/DiegoZaluski/cosh"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
globset = "0.4.18"
grep-matcher = "0.1.8"
grep-regex = "0.1.14"
grep-searcher = "0.1.16"
ignore = "0.4.25"
libc = "0.2"
log = "0.4"
lru = "0.18"
memmap2 = "0.9.9"
miniz_oxide = "0.8"
rayon = "1"
regex = "1"
serde_json = "1.0.150"
similar = "3.1.1"
smallvec = "1"
tree-sitter = "0.25"
tree-sitter-c-sharp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-haskell = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-swift = "0.7"
tree-sitter-zig = "1.1"
tree-sitter-kotlin = "0.4"

# ast::* — ast-grep structural matching (vendored from oh-my-pi pi-ast/pi-natives).
# Versions mirror the upstream workspace. `tree-sitter` is unified on the
# ast-grep line (0.25): the runtime crate links a single native lib, so cosh's
# own `tree_sitter` module and ast-grep must share one version.
ast-grep-core = { version = "0.39", default-features = false, features = ["tree-sitter"] }
phf = { version = "0.13", features = ["macros"] }
tree-sitter-astro = { version = "0.1.1", package = "tree-sitter-astro-next" }
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-clojure = "0.1"
tree-sitter-cmake = "0.7.1"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-dart = "0.2"
tree-sitter-diff = "0.1"
tree-sitter-dockerfile = { version = "0.2.0", package = "tree-sitter-dockerfile-updated" }
tree-sitter-elixir = "0.3"
tree-sitter-elisp = "1.6.1"
tree-sitter-erlang = "0.16.0"
tree-sitter-fortran = "0.6.0"
tree-sitter-graphql = "0.1.0"
tree-sitter-hcl = "1.1"
tree-sitter-html = "0.23"
tree-sitter-ini = "1.4.0"
tree-sitter-json = "0.24"
tree-sitter-julia = "0.23"
tree-sitter-just = "0.2.0"
tree-sitter-lua = "0.5"
tree-sitter-make = "1.1"
tree-sitter-md = "0.5"
tree-sitter-nix = "0.3"
tree-sitter-objc = "3.0"
tree-sitter-ocaml = "0.24.2"
tree-sitter-odin = "1.3"
tree-sitter-php = "0.24"
tree-sitter-powershell = "0.26.4"
tree-sitter-proto = "0.4.0"
tree-sitter-r = "1.2.0"
tree-sitter-regex = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-scala = "0.26"
tree-sitter-solidity = "1.2"
tree-sitter-sql = { version = "0.3.11", package = "tree-sitter-sequel" }
tree-sitter-starlark = "1.3"
tree-sitter-svelte = { version = "0.1.1", package = "tree-sitter-svelte-next" }
tree-sitter-tlaplus = "1.5"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-verilog = "1.0"
tree-sitter-vue = { version = "0.1.0", package = "tree-sitter-vue-next" }
tree-sitter-xml = "0.7"
tree-sitter-yaml = "0.7"
xxhash-rust = { version = "0.8", features = ["xxh32"] }
tokio = { version = "1.52.3", features = ["full"] }
async-stream = "0.3"
tokio-stream = "0.1"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
directories = "6.0.0"
zeroize = { version = "=1.7", features = ["derive"] }
keyring = { version = "4.1.6", features = [
    "v1",
    "apple-native-keyring-store",
    "windows-native-keyring-store",
    "zbus-secret-service-keyring-store",
] }
# term_screen dependencies
base64 = "0.22"
bitflags = { version = "2", features = ["serde"] }
csscolorparser = "0.7"
downcast-rs = "1.2"
hex = "0.4"
finl_unicode = "1.3"
fixedbitset = { version = "0.5", features = ["serde"] }
lazy_static = "1.5"
num-derive = "0.4"
num-traits = "0.2"
ordered-float = { version = "4.5", features = ["serde"] }
siphasher = "1.0"
terminfo = "0.9"
thiserror = "2"
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
unicode-width = "0.2"
url = "2.5"
vtparse = "0.7"

[dev-dependencies]
env_logger = "0.11"
insta = { version = "1", features = ["filters"] }
serial_test = "3"

[lints]
workspace = true

# Examples are organized in subdirectories that mirror the module layout
# (e.g. examples/hashline/run.rs), so they need explicit targets.
[[example]]
name = "hashline-patcher"
path = "examples/hashline/patcher.rs"

[[example]]
name = "rollback"
path = "examples/rollback/core.rs"
