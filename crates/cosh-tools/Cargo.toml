[package]
categories = ["development-tools"]
description = "Tools crate for cosh - coding agent for the terminal"
keywords = ["ai", "coding", "terminal", "agent"]
license = "Apache-2.0"
name = "cosh-tools"
readme = "README.md"
repository = "https://github.com/DiegoZaluski/cosh"
version = "0.1.0"
edition = "2024"

[dependencies]
schemars = "1"
thiserror = "2"
portable-pty = "0.9.0"
serde_json = "1"
rs-trafilatura = "0.2.2"
async-stream = "0.3"
log = "0.4"
regex = "1"
strip-ansi-escapes = "0.2"
libc = "0.2"
proptest = "1"
tokio-stream = "0.1"

[dev-dependencies.tokio]
version = "1.52.3"
features = ["rt", "macros"]

[dependencies.tokio]
version = "1.52.3"
features = ["full"]

[dependencies.reqwest]
version = "0.13"
features = ["json"]

[dependencies.serde]
version = "1"
features = ["derive"]

[features]
embed = ["cosh-recall/lancedb"]

[dependencies.cosh-recall]
path = "../cosh-recall"
optional = true
features = ["lancedb"]

[dependencies.cosh-sdk]
path = "../cosh-sdk"

[dependencies.ast-grep-core]
version = "0.39"
default-features = false
features = ["tree-sitter"]

[dependencies.tree-sitter]
version = "0.25"

[lints]
workspace = true

# Examples are organized in subdirectories that mirror the module layout
# (e.g. examples/fs/read.rs), so they need explicit targets.
[[example]]
name = "fs-read"
path = "examples/fs/read.rs"

[[example]]
name = "fs-write"
path = "examples/fs/write.rs"

[[example]]
name = "fs-edit"
path = "examples/fs/edit.rs"

[[example]]
name = "fs-ast-edit"
path = "examples/fs/ast_edit.rs"

[[example]]
name = "fs-rollback"
path = "examples/fs/rollback.rs"

[[example]]
name = "find-glob"
path = "examples/find/glob.rs"

[[example]]
name = "find-grep"
path = "examples/find/grep.rs"

[[example]]
name = "bash-run"
path = "examples/bash/run.rs"

[[example]]
name = "plan-run"
path = "examples/plan/run.rs"
