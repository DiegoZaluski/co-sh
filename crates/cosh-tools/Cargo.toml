[package]
categories = ["development-tools"]
description = "Tools crate for cosh - coding agent for the terminal"
keywords = ["ai", "coding", "terminal", "agent"]
license = "Apache-2.0"
name = "cosh-tools"
readme = "README.md"
repository = "https://github.com/DiegoZaluski/co-sh"
version = "0.1.1"
edition = "2024"

[dependencies]
schemars = "1"
thiserror = "2"
portable-pty = "0.9.0"
serde_json = "1"
rs-trafilatura = "0.2.2"
async-stream = "0.3"
log = "0.4"
regex = "1"
strip-ansi-escapes = "0.2"
libc = "0.2"
tokio-stream = "0.1"
agent-client-protocol = "2.2"

# Kernel-pinned filesystem sandboxing for the ACP sub-agent `fs/*` requests
# (`openat` component walk with `O_NOFOLLOW`, see `subagent/acp.rs`).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

# Desktop UI tools: OS accessibility tree, screenshots and input synthesis
# (always use the newest published version — the crate is under active
# development and adds capabilities frequently).
[dependencies.xa11y]
version = "0.15"

[dev-dependencies]
cosh-sdk = { path = "../cosh-sdk", version = "0.1.1" }
tempfile = "3"

[dev-dependencies.xa11y]
version = "0.15"
features = ["test-support"]

[dev-dependencies.tokio]
version = "1.52.3"
features = ["rt", "macros"]

[dependencies.tokio]
version = "1.52.3"
features = ["full"]

[dependencies.reqwest]
version = "0.13"
features = ["json"]

[dependencies.serde]
version = "1"
features = ["derive"]

[features]
embed = ["cosh-recall/lancedb"]

[dependencies.cosh-recall]
path = "../cosh-recall"
version = "0.1.0"
optional = true
features = ["lancedb"]

[dependencies.cosh-sdk]
path = "../cosh-sdk"
version = "0.1.0"

[dependencies.ast-grep-core]
version = "0.39"
default-features = false
features = ["tree-sitter"]

[dependencies.tree-sitter]
version = "0.25"

[lints]
workspace = true

# Examples are organized in subdirectories that mirror the module layout
# (e.g. examples/fs/read.rs), so they need explicit targets.
[[example]]
name = "fs-read"
path = "examples/fs/read.rs"

[[example]]
name = "fs-write"
path = "examples/fs/write.rs"

[[example]]
name = "fs-edit"
path = "examples/fs/edit.rs"

[[example]]
name = "fs-ast-edit"
path = "examples/fs/ast_edit.rs"

[[example]]
name = "fs-rollback"
path = "examples/fs/rollback.rs"

[[example]]
name = "find-glob"
path = "examples/find/glob.rs"

[[example]]
name = "find-grep"
path = "examples/find/grep.rs"

[[example]]
name = "bash"
path = "examples/bash/bash.rs"

[[example]]
name = "plan"
path = "examples/plan/plan.rs"

[[example]]
name = "skills"
path = "examples/skills/skills.rs"

[[example]]
name = "subagent"
path = "examples/subagent/subagent.rs"

[[example]]
name = "web"
path = "examples/web/web.rs"

[[example]]
name = "question"
path = "examples/question/question.rs"

[[example]]
name = "recall"
path = "examples/recall/recall.rs"
required-features = ["embed"]

[[example]]
name = "computer-control"
path = "examples/computer/control.rs"

[[example]]
name = "computer-act"
path = "examples/computer/act.rs"

[[example]]
name = "computer-wait"
path = "examples/computer/wait.rs"

[[example]]
name = "computer-apps"
path = "examples/computer/apps.rs"

[[example]]
name = "computer-snapshot"
path = "examples/computer/snapshot.rs"

[[example]]
name = "computer-screenshot"
path = "examples/computer/screenshot.rs"

[[example]]
name = "computer-surface"
path = "examples/computer/surface.rs"

[[example]]
name = "computer-errors"
path = "examples/computer/errors.rs"

[[example]]
name = "computer-mouse"
path = "examples/computer/mouse.rs"

[[example]]
name = "computer-keyboard"
path = "examples/computer/keyboard.rs"

[dev-dependencies.criterion]
version = "0.7"

[[bench]]
name = "fuzzy"
harness = false
