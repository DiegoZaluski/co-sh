[package]
categories = ["development-tools"]
description = "Tools crate for cosh - coding agent for the terminal"
keywords = ["ai", "coding", "terminal", "agent"]
license = "Apache-2.0"
name = "cosh-tools"
readme = "README.md"
repository = "https://github.com/DiegoZaluski/cosh"
version = "0.1.0"
edition = "2024"

[dependencies]
schemars = "1"
thiserror = "2"
portable-pty = "0.9.0"
serde_json = "1"
rs-trafilatura = "0.2.2"
async-stream = "0.3"
log = "0.4"
regex = "1"
strip-ansi-escapes = "0.2"
libc = "0.2"
proptest = "1"
tokio-stream = "0.1"

[dev-dependencies.tokio]
version = "1.52.3"
features = ["rt", "macros"]

[dependencies.tokio]
version = "1.52.3"
features = ["full"]

[dependencies.reqwest]
version = "0.13"
features = ["json"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.cosh-recall]
path = "../cosh-recall"
features = ["lancedb"]

[dependencies.cosh-sdk]
path = "../cosh-sdk"

[lints]
workspace = true
