[package]
name = "cosh-tools"
version = "0.1.0"
edition = "2024"

[dependencies]
portable-pty = "0.9.0"
serde_json = "1"
rs-trafilatura = "0.2.2"
async-stream = "0.3"
log = "0.4"
regex = "1"

[dependencies.cosh-sdk]
path = "../cosh-sdk"

[dev-dependencies.tokio]
version = "1.52.3"
features = ["rt", "macros"]


[dependencies.tokio]
version = "1.52.3"
features = ["full"]

[dependencies.tokio-stream]
version = "0.1"

[dependencies.reqwest]
version = "0.13"
features = ["json"]

[dependencies.serde]
version = "1"
features = ["derive"]
