[package]
categories = ["development-tools"]
description = "TUI crate for cosh - coding agent for the terminal"
keywords = ["ai", "coding", "terminal", "agent"]
license = "Apache-2.0"
name = "cosh-tui"
readme = "README.md"
repository = "https://github.com/DiegoZaluski/cosh"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.30"
bitflags = "2.13"
taffy = "0.11.0"
pulldown-cmark = "0.13"
cosh-sdk = { path = "../cosh-sdk" }
finl_unicode = "1.3"
unicode-width = "0.2"
lru = "0.18"
log = { version = "0.4", features = ["std"] }

[lints]
workspace = true
