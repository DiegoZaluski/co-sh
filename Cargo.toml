[workspace]
members = ["crates/cosh-harness","crates/cosh-sdk", "crates/cosh-tools"]

[package]
description = "Coding agent for the terminal. No UI, no noise."
edition = "2021"
license = "Apache-2.0"
name = "cosh"
repository = "https://github.com/DiegoZaluski/cosh"
version = "0.0.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies.cosh-harness]
path = "crates/cosh-harness"

[dependencies.cosh-sdk]
path = "crates/cosh-sdk"

[dependencies.cosh-tools]
path = "crates/cosh-tools"

[dependencies.ratatui]
version = "0.30.2"
default-features = false
features = []

# ---
[dependencies.tokio]
version = "1"
features = ["full"]

[dependencies.rmcp]
version = "1.8.0"
features = ["server", "transport-io"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.schemars]
version = "1"

[dependencies.anyhow]
version = "1"

[patch.crates-io]
tree-sitter-kotlin = { git = "https://github.com/fwcd/tree-sitter-kotlin", rev = "c8ac3d2627240160b999a2c100de3babbdb8f419" }
