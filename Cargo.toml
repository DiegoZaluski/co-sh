[workspace]
members = ["crates/cosh-onnx",
  "crates/cosh-recall",
  "crates/cosh-sdk",
  "crates/cosh-tools",
  "crates/cosh-tui",
]

[features]
default = []
embed = ["cosh-tools/embed", "fastembed"]
lancedb = ["cosh-recall/lancedb"]
fastembed = ["cosh-recall/fastembed", "dep:fastembed"]
cloud = ["cosh-recall/cloud"]
# The ONNX decision engine (cosh-onnx): gates the heavy ONNX runtime
# (`ort`/`tokenizers`) out of the dependency graph. Without it the binary
# never links ONNX Runtime and the harness compiles the Checkup trait only.
onnx = ["dep:cosh-onnx"]

[package]
description = "..."
edition = "2024"
license = "Apache-2.0"
name = "cosh"
readme = "README.md"
repository = "https://github.com/DiegoZaluski/cosh"
version = "0.1.0"
keywords = ["terminal", "cli"]
categories = ["command-line-utilities"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies.cosh-recall]
path = "crates/cosh-recall"

[dependencies.cosh-sdk]
path = "crates/cosh-sdk"

[dependencies.cosh-tools]
path = "crates/cosh-tools"

[dependencies.cosh-onnx]
path = "crates/cosh-onnx"
optional = true

[dependencies.cosh-tui]
path = "crates/cosh-tui"

[dependencies.fastembed]
# Pinned to 7: it selects `ort =2.0.0-rc.13` (ndarray, std, api-24), matching
# cosh-onnx so the workspace builds a single ort.
version = "7"
optional = true

[[bin]]
name = "cosh"
path = "src/tui/main.rs"

[[bin]]
name = "cosh-uninstall"
path = "src/bin/cosh_uninstall.rs"

[[bin]]
name = "highlight-demo"
path = "src/bin/highlight_demo.rs"

# The decision daemon, gated on the same feature as the ONNX runtime: the
# daemon exists only when the model does, and without `onnx` the binary is
# never built at all.
[[bin]]
name = "cosh-decisiond"
path = "src/daemon/decision/main.rs"
required-features = ["onnx"]

# ---
[dependencies]
serde_json = "1.0"
# toml = "1.1"
chrono = "0.4"
log = { version = "0.4", features = ["std"] }
dotenvy = "0.15.7"
anyhow = "1"
# Parallel cold rebuild of the session view's height cache (a left-panel
# toggle re-estimates every message height; see SessionView's width-snapshot
# logic). Same crate/version the workspace already uses in cosh-sdk.
rayon = "1"
# Reused workspace-wide at these exact versions (see crates/cosh-sdk,
# crates/cosh-tools, crates/cosh-recall): error enums, header maps, URL
# parsing for the MCP client. Not new crates, just newly direct.
thiserror = "2"
# The activation lock (`flock`) that serializes daemon bind races — see
# `daemon::activation`. Same crate/version cosh-tools already carries.
libc = "0.2"
http = "1"
url = "2"
# GitHub release check for the home update banner (same crate/version the
# cosh-sdk connector already uses for its catalog fetches).
reqwest = { version = "0.13", features = ["json"] }
schemars = "1"
crossterm = { version = "0.29", features = ["bracketed-paste"] }
directories = "6.0.0"
regex = "1"
tiktoken-rs = "0.12.0"
keyring = { version = "4.1.6", features = [
    "v1",
    "apple-native-keyring-store",
    "windows-native-keyring-store",
    "zbus-secret-service-keyring-store",
] }

# ---
# Display-width measurement for the footer (already a transitive dependency
# of ratatui; promoted to direct use for right-anchored segments).
[dependencies.unicode-width]
version = "0.2"

# ---
[dependencies.ratatui]
version = "0.30.2"
default-features = false
features = ["crossterm"]

# ---
[dependencies.tokio]
version = "1"
features = ["full"]

[dependencies.serde]
version = "1"
features = ["derive", "rc"]

[dependencies.rmcp]
version = "3.2.0"
features = [
  "client",
  "server",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
]
default-features = false

[dependencies.tokio-stream]
version = "0.1"

[dependencies.xxhash-rust]
version = "0.8"
features = ["xxh32", "xxh64"]

# OS entropy for telemetry identifiers (audit F04): no time/address-derived
# fallbacks — when entropy is unavailable the telemetry event is dropped.
[dependencies.getrandom]
version = "0.3"

[dependencies.arboard]
version = "3"
default-features = false
features = []

[dependencies.open]
version = "5"
[dependencies.notify-rust]
version = "4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dependencies.pulldown-cmark]
version = "0.13"

[dependencies.lru]
version = "0.18"

# ---
[dev-dependencies]
tempfile = "3"
parking_lot = "0.12"

# In-process loopback TLS fixture for the telemetry transport tests (no
# external process, no Python, no openssl CLI).
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[patch.crates-io]
tree-sitter-kotlin = { git = "https://github.com/fwcd/tree-sitter-kotlin", rev = "c8ac3d2627240160b999a2c100de3babbdb8f419" }

# Performance profiles
# The TUI's hot path lives almost entirely in dependencies (tree-sitter,
# unicode-width, ratatui, pulldown-cmark, regex, taffy). Unoptimized, those
# make every frame 20-100x slower — a debug `target/debug/cosh` measured
# 127ms/frame with an active tool spinner vs 2.7ms optimized, which is the
# source of the "TUI freezes while the agent works" reports.
#
# Keep cosh's own crates unoptimized (fast iteration, real line numbers) but
# build every dependency with full optimizations in dev.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"

# ___
[workspace.lints.clippy]
perf = "deny"

# Shared dependency declarations
# Single source of truth for cross-crate dependencies. Crates opt in with
# `<dep>.workspace = true`; pre-existing inline versions keep working until
# they are migrated one crate at a time.
[workspace.dependencies]
lsp-types = "0.97"
