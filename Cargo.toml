[workspace]
members = [
  "cosh-server",
  "crates/cosh-recall",
  "crates/cosh-sdk",
  "crates/cosh-tools",
  "crates/cosh-tui",
]

[features]
default = []
lancedb = ["cosh-recall/lancedb"]

[package]
description = "Coding agent for the terminal. No UI, no noise."
edition = "2024"
license = "Apache-2.0"
name = "cosh"
readme = "README.md"
repository = "https://github.com/DiegoZaluski/cosh"
version = "0.0.0"
keywords = ["terminal", "cli"]
categories = ["command-line-utilities"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies.cosh-recall]
path = "crates/cosh-recall"

[dependencies.cosh-sdk]
path = "crates/cosh-sdk"

[dependencies.cosh-tools]
path = "crates/cosh-tools"

[dependencies.cosh-tui]
path = "crates/cosh-tui"

[[bin]]
name = "tui"
path = "src/tui/main.rs"

# ---
[dependencies]
serde_json = "1.0"
# toml = "1.1"
chrono = "0.4"
log = { version = "0.4", features = ["std"] }
dotenvy = "0.15.7"
anyhow = "1"
schemars = "1"
crossterm = { version = "0.29", features = ["bracketed-paste"] }
directories = "6.0.0"

# ---
[dependencies.ratatui]
version = "0.30.2"
default-features = false
features = ["crossterm"]

# ---
[dependencies.tokio]
version = "1"
features = ["full"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.rmcp]
version = "1.8.0"
features = [
  "client",
  "server",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
]
default-features = false

[dependencies.tokio-stream]
version = "0.1"

[dependencies.xxhash-rust]
version = "0.8"
features = ["xxh32"]

[dependencies.arboard]
version = "3"
default-features = false
features = []

[dependencies.pulldown-cmark]
version = "0.13"

# ---
[dev-dependencies]
tempfile = "3"

[patch.crates-io]
tree-sitter-kotlin = { git = "https://github.com/fwcd/tree-sitter-kotlin", rev = "c8ac3d2627240160b999a2c100de3babbdb8f419" }


# ___ lints ___

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
too_many_arguments = { level = "allow", priority = 1 }
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
cargo    = { level = "warn", priority = -1 }

similar_names           = "allow"
too_many_lines          = "allow"
cast_possible_truncation = "allow"
cast_sign_loss           = "allow"
cast_precision_loss      = "allow"

default_numeric_fallback = "warn"
exit                  = "warn"
implicit_clone      = "warn"

unwrap_used   = "warn"
expect_used   = "warn"
panic         = "warn"
todo          = "warn"
unimplemented = "warn"
dbg_macro     = "warn"
print_stdout  = "allow"
print_stderr  = "allow"

missing_panics_doc = "warn"
missing_errors_doc = "warn"
missing_safety_doc = "deny"

clone_on_copy        = "deny"
redundant_clone       = "warn"
unnecessary_to_owned  = "warn"
needless_pass_by_value = "warn"
large_enum_variant    = "warn"
large_stack_arrays    = "warn"
