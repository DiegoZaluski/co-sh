[workspace]
members = [
  "cosh-server",
  "crates/cosh-recall",
  "crates/cosh-sdk",
  "crates/cosh-tools",
  "crates/cosh-tui",
]

[features]
default = []
embed = ["cosh-tools/embed", "fastembed"]
lancedb = ["cosh-recall/lancedb"]
fastembed = ["cosh-recall/fastembed", "dep:fastembed"]
cloud = ["cosh-recall/cloud"]

[package]
description = "..."
edition = "2024"
license = "Apache-2.0"
name = "cosh"
readme = "README.md"
repository = "https://github.com/DiegoZaluski/cosh"
version = "0.0.0"
keywords = ["terminal", "cli"]
categories = ["command-line-utilities"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies.cosh-recall]
path = "crates/cosh-recall"

[dependencies.cosh-sdk]
path = "crates/cosh-sdk"

[dependencies.cosh-tools]
path = "crates/cosh-tools"

[dependencies.cosh-tui]
path = "crates/cosh-tui"

[dependencies.fastembed]
version = "5"
optional = true

[[bin]]
name = "cosh"
path = "src/tui/main.rs"

[[bin]]
name = "highlight-demo"
path = "src/bin/highlight_demo.rs"

# ---
[dependencies]
serde_json = "1.0"
bincode = "1.3"
# toml = "1.1"
chrono = "0.4"
log = { version = "0.4", features = ["std"] }
dotenvy = "0.15.7"
anyhow = "1"
schemars = "1"
crossterm = { version = "0.29", features = ["bracketed-paste"] }
directories = "6.0.0"
text-splitter = "0.32.0"
nalgebra = "0.33"
regex = "1"
tiktoken-rs = "0.12.0"
keyring = { version = "4.1.6", features = [
    "v1",
    "apple-native-keyring-store",
    "windows-native-keyring-store",
    "zbus-secret-service-keyring-store",
] }

# ---
[dependencies.ratatui]
version = "0.30.2"
default-features = false
features = ["crossterm"]

# ---
[dependencies.tokio]
version = "1"
features = ["full"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.rmcp]
version = "1.8.0"
features = [
  "client",
  "server",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
]
default-features = false

[dependencies.tokio-stream]
version = "0.1"

[dependencies.xxhash-rust]
version = "0.8"
features = ["xxh32", "xxh64"]

[dependencies.arboard]
version = "3"
default-features = false
features = []

[dependencies.open]
version = "5"

[dependencies.pulldown-cmark]
version = "0.13"

[dependencies.lru]
version = "0.18"

# ---
[dev-dependencies]
tempfile = "3"

[patch.crates-io]
tree-sitter-kotlin = { git = "https://github.com/fwcd/tree-sitter-kotlin", rev = "c8ac3d2627240160b999a2c100de3babbdb8f419" }

# ___
[workspace.lints.clippy]
perf = "deny"
